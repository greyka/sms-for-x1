<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="64" y1="48" x2="448" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="0.55" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="bubble" x1="150" y1="150" x2="360" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9EEFF"/>
    </linearGradient>
    <linearGradient id="sig" x1="300" y1="300" x2="410" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="innerglow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#1E3A8A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- squircle-фон бренда -->
  <path filter="url(#shadow)" d="M256 40
      C 132 40 40 132 40 256
      C 40 380 132 472 256 472
      C 380 472 472 380 472 256
      C 472 132 380 40 256 40 Z"
      fill="url(#bg)"/>

  <!-- мягкий блик сверху -->
  <path d="M256 52 C 150 52 64 132 56 236 C 120 150 300 132 420 196 C 388 108 330 52 256 52 Z"
        fill="#FFFFFF" opacity="0.10"/>

  <!-- пузырь сообщения -->
  <g filter="url(#innerglow)">
    <path d="M168 150
        h150
        c 26 0 46 20 46 46
        v92
        c 0 26 -20 46 -46 46
        h-92
        l-58 46
        v-46
        h-0
        c -26 0 -46 -20 -46 -46
        v-92
        c 0 -26 20 -46 46 -46 Z"
        fill="url(#bubble)"/>
  </g>

  <!-- три точки внутри пузыря -->
  <circle cx="196" cy="242" r="15" fill="#3B82F6"/>
  <circle cx="244" cy="242" r="15" fill="#6366F1"/>
  <circle cx="292" cy="242" r="15" fill="#8B5CF6"/>

  <!-- индикатор сигнала (уголок) -->
  <g>
    <rect x="330" y="300" width="16" height="24" rx="6" fill="url(#sig)" opacity="0.55"/>
    <rect x="356" y="286" width="16" height="38" rx="6" fill="url(#sig)" opacity="0.75"/>
    <rect x="382" y="268" width="16" height="56" rx="6" fill="url(#sig)"/>
  </g>
</svg>
